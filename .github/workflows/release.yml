name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: demo-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: demo-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: demo-macos-x86_64

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/vite-monorepo/pnpm-lock.yaml

      - name: 构建前端
        run: |
          cd frontend/vite-monorepo
          pnpm install --frozen-lockfile
          pnpm build

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 打包（Linux/macOS）
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/demo package/${{ matrix.artifact }}
          chmod +x package/${{ matrix.artifact }}
          tar -czf ${{ matrix.artifact }}.tar.gz -C package .

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item target\${{ matrix.target }}\release\demo.exe package\${{ matrix.artifact }}
          Compress-Archive -Path package\* -DestinationPath ${{ matrix.artifact }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
